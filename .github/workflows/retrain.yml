name: Weekly Model Retrain

on:
  schedule:
    # Every Sunday at 2:00 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    # Manual trigger from GitHub UI

jobs:
  retrain:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r ml-backend/requirements.txt

      - name: Run retrain pipeline
        run: |
          cd ml-backend
          python -c "
          import sys, os
          sys.path.insert(0, os.getcwd())
          from pipeline.retrain import retrain_all
          result = retrain_all(trigger='scheduled')
          print(result)
          "

      - name: Commit updated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ml-backend/artifacts/ retrain_log.json
          git diff --staged --quiet || git commit -m "chore: weekly model retrain [skip ci]"
          git push
